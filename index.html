<title>🦘 Cape York 2026</title>
<style>
:root{
  --or:#C0600C;--or2:#E8893A;--bg:#F2EDE7;--wh:#fff;
  --bdr:#DDD4C8;--tx:#1A1714;--tx2:#6B6460;--tx3:#A89F98;
  --gr:#2A7A46;--bl:#1A6FA5;--rd:#B52525;--am:#8A6200;
  --navh:64px;--toph:56px;--radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:-apple-system,'Segoe UI',Arial,sans-serif;color:var(--tx);font-size:16px;line-height:1.5}

/* TOPBAR */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--toph);background:var(--or);display:flex;align-items:center;padding:0 16px;z-index:200;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.topbar-title{color:#fff;font-size:18px;font-weight:700;letter-spacing:-.2px}
.topbar-sub{color:rgba(255,255,255,.75);font-size:12px;margin-top:1px}

/* CONTENT */
.content{position:fixed;top:var(--toph);bottom:var(--navh);left:0;right:0;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* BOTTOM NAV */
.nav{position:fixed;bottom:0;left:0;right:0;height:var(--navh);background:var(--wh);border-top:1px solid var(--bdr);display:grid;grid-template-columns:repeat(4,1fr);z-index:200;box-shadow:0 -2px 10px rgba(0,0,0,.06)}
.nb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:transparent;cursor:pointer;color:var(--tx3);font-size:10px;font-family:inherit;padding:6px 0;transition:color .15s;-webkit-user-select:none;user-select:none}
.nb.active{color:var(--or)}
.nb-icon{font-size:22px;line-height:1;pointer-events:none}
.nb-lbl{font-size:10px;font-weight:500;pointer-events:none}

/* TABS */
.tab{display:none;padding:12px 0 20px}
.tab.active{display:block}

/* SECTION HEADER */
.shdr{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--tx2);padding:16px 16px 6px}
.shdr:first-child{padding-top:8px}

/* CARD BASE */
.card{background:var(--wh);border-radius:var(--radius);margin:0 12px 8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08)}

/* DAY CARD */
.dcard{background:var(--wh);border-radius:var(--radius);margin:0 12px 8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.dhead{display:flex;align-items:center;padding:14px 16px;cursor:pointer;gap:12px;min-height:62px}
.dnum{font-size:12px;font-weight:700;color:var(--or);min-width:42px;text-align:center;background:#FEF0E6;border-radius:8px;padding:4px 6px;line-height:1.3;flex-shrink:0}
.dnum-n{font-size:18px;font-weight:800;display:block}
.dinfo{flex:1;min-width:0}

// ─────────────────────────────────────────────
//  STATE & LOCALSTORAGE
// ─────────────────────────────────────────────

function getChecked(id){
  try{return JSON.parse(localStorage.getItem('ck_'+id))||false}catch(e){return false}
}
function setChecked(id,val){
  try{localStorage.setItem('ck_'+id,JSON.stringify(val))}catch(e){}
}
function resetAll(prefix){
  const keys=[];
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('ck_'+prefix))keys.push(k);}
  keys.forEach(k=>localStorage.removeItem(k));}catch(e){}
}

// ─────────────────────────────────────────────
//  RENDER: MENU
// ─────────────────────────────────────────────

function renderMenu(){
  const el=document.getElementById('tab-menu');
  let h='';
  DAYS.forEach((d,i)=>{
    if(i===0) h+=phase('Cairns → Bamaga · 11.–19. April');
    if(i===9) h+=phase('Bamaga → Cairns · 20.–26. April');
    const restCount=[d.f,d.m,d.ab].filter(x=>x.rest).length;
    let badge='';
    if(d.bamaga) badge+='<span class="tag tag-n">NEU ✓</span>';
    if(restCount===3) badge+='<span class="tag tag-r">Ganztag Restaurant</span>';
    else if(restCount>0) badge+=`<span class="tag tag-r">${restCount}× Restaurant</span>`;
    h+=`<div class="dcard"><div class="dhead" onclick="toggleDay(this)">
      <div class="dnum"><span class="dnum-n">${d.d}</span>${d.dt.split(',')[0]}</div>
      <div class="dinfo"><div class="dtitle">${d.dt}${badge}</div><div class="ddate">${mealSummary(d)}</div></div>
      <div class="darr">▾</div>
    </div><div class="dbody">
      ${mealRow('Frühstück',d.f)}
      ${mealRow('Mittagessen',d.m)}
      ${mealRow('Abendessen',d.ab)}
    </div></div>`;
  });
  el.innerHTML=h;
}

function phase(txt){
  return `<div class="phase"><div class="phase-line"></div><div class="phase-txt">${txt}</div><div class="phase-line"></div></div>`;
}

function mealSummary(d){
  const names=[d.f,d.m,d.ab].map(x=>x.rest?'🍽 Restaurant':x.t.split('(')[0].trim().substring(0,25));
  return names.join(' · ');
}

function mealRow(lbl,meal){
  if(!meal) return '';
  if(meal.rest){
    return `<div class="meal"><div class="mlbl">${lbl}</div><div class="mtext mrest">🍽 ${meal.rname}</div></div>`;
  }
  const tagHtml = meal.tag ? `<span class="tag ${meal.tagColor==='b'?'tag-b':'tag-f'}">${meal.tag}</span>` : '';
  const recipeLink = meal.r ? `<span style="color:var(--bl);font-size:12px;margin-left:6px;cursor:pointer" onclick="jumpToRecipe('${meal.r}')">→ Rezept</span>` : '';
  return `<div class="meal"><div class="mlbl">${lbl}</div><div class="mtext">${meal.t}${tagHtml}${recipeLink}</div><div class="mkcal">${meal.k||''}</div></div>`;
}

function toggleDay(el){
  const b=el.nextElementSibling,a=el.querySelector('.darr');
  const o=b.classList.toggle('open');
  a.classList.toggle('open',o);
}

// ─────────────────────────────────────────────
//  RENDER: RECIPES
// ─────────────────────────────────────────────

function renderRecipes(){
  const el=document.getElementById('tab-recipes');
  let h='';
  ['f','m','a'].forEach(cat=>{
    const catLbls={f:'🌅 Frühstück',m:'☀️ Mittagessen',a:'🌙 Abendessen'};
    const catClasses={f:'rcat-f',m:'rcat-m',a:'rcat-a'};
    h+=`<div class="shdr">${catLbls[cat]}</div>`;
    RECIPES.filter(r=>r.cat===cat).forEach(r=>{
      h+=`<div class="rcard"><div class="rhead" onclick="toggleRecipe(this,'${r.id}')">
        <div class="ricon">${r.icon}</div>
        <div class="rinfo">
          <div class="rname">${r.name}</div>
          <div class="rmeta">⏱ ${r.time} &nbsp;·&nbsp; 🍳 ${r.tools} &nbsp;·&nbsp; 🔥 ${r.kcal}</div>
        </div>
        <div class="rarr">▾</div>
      </div><div class="rbody" id="recipe-${r.id}">
        <div class="rsec">Zutaten für 2 Personen</div>
        <div>${r.ing.map(([n,a])=>`<div class="ring"><span class="ring-name">${n}</span><span class="ring-amt">${a}</span></div>`).join('')}</div>
        <div class="rsec">Zubereitung</div>
        <div>${r.steps.map((s,i)=>`<div class="rstep"><div class="rstep-n">${i+1}</div><div class="rstep-t">${s}</div></div>`).join('')}</div>
        <div class="rtip">💡 ${r.tip}</div>
      </div></div>`;
    });
  });
  el.innerHTML=h;
}

function toggleRecipe(el,id){
  const b=document.getElementById('recipe-'+id);
  const a=el.querySelector('.rarr');
  const o=b.classList.toggle('open');
  a.classList.toggle('open',o);
}

function jumpToRecipe(id){
  showTab('recipes');
  setTimeout(()=>{
    const el=document.getElementById('recipe-'+id);
    if(el){
      const head=el.previousElementSibling;
      if(!el.classList.contains('open')){
        el.classList.add('open');
        head.querySelector('.rarr').classList.add('open');
      }
      el.scrollIntoView({behavior:'smooth',block:'start'});
    }
  },100);
}

// ─────────────────────────────────────────────
//  RENDER: CHECKLISTS
// ─────────────────────────────────────────────

function renderChecklist(tabId, data, prefix, title, note){
  const el=document.getElementById('tab-'+tabId);
  const allItems=data.flatMap(c=>c.items);
  const total=allItems.length;
  const checked=allItems.filter(it=>getChecked(it.id)).length;
  const pct=total>0?Math.round(checked/total*100):0;

  let h=`<div class="note ${tabId==='cairns'?'note-w':'note-s'}">${note}</div>`;
  h+=`<div class="prog-card" id="${prefix}-prog">
    <div class="prog-row"><span class="prog-label">${title}</span><span class="prog-count" id="${prefix}-count">${checked} / ${total} abgehakt</span></div>
    <div class="prog-track"><div class="prog-fill" id="${prefix}-fill" style="width:${pct}%"></div></div>
    <div class="prog-actions">
      <button class="prog-btn" onclick="resetList('${prefix}')">Alles zurücksetzen</button>
      <button class="prog-btn done-all" onclick="checkAll('${prefix}')">Alles abhaken ✓</button>
    </div>
  </div>`;

  if(pct===100){
    h+=`<div class="celebrate"><div>🎉</div><p>Alles eingekauft — Cape York, wir kommen!</p></div>`;
  }

  data.forEach(cat=>{
    h+=`<div class="catcard"><div class="cathdr">${cat.cat}</div>`;
    cat.items.forEach(it=>{
      const ck=getChecked(it.id);
      h+=`<div class="chk-item" onclick="toggleItem('${it.id}','${prefix}')" id="item-${it.id}">
        <div class="chk-cb ${ck?'checked':''}" id="cb-${it.id}"></div>
        <span class="chk-name ${ck?'done':''}" id="nm-${it.id}">${it.name}</span>
        <span class="chk-qty ${ck?'done':''}" id="qt-${it.id}">${it.qty}</span>
      </div>`;
    });
    h+='</div>';
  });

  el.innerHTML=h;
}

function toggleItem(id,prefix){
  const val=!getChecked(id);
  setChecked(id,val);
  const cb=document.getElementById('cb-'+id);
  const nm=document.getElementById('nm-'+id);
  const qt=document.getElementById('qt-'+id);
  if(cb) cb.className='chk-cb'+(val?' checked':'');
  if(nm) nm.className='chk-name'+(val?' done':'');
  if(qt) qt.className='chk-qty'+(val?' done':'');
  updateProgress(prefix);
}

function updateProgress(prefix){
  const data=prefix==='c'?CAIRNS:BAMAGA;
  const allItems=data.flatMap(c=>c.items);
  const total=allItems.length;
  const checked=allItems.filter(it=>getChecked(it.id)).length;
  const pct=total>0?Math.round(checked/total*100):0;
  const countEl=document.getElementById(prefix+'-count');
  const fillEl=document.getElementById(prefix+'-fill');
  if(countEl) countEl.textContent=checked+' / '+total+' abgehakt';
  if(fillEl) fillEl.style.width=pct+'%';
  if(pct===100){
    const tabId=prefix==='c'?'cairns':'bamaga';
    const tab=document.getElementById('tab-'+tabId);
    if(!tab.querySelector('.celebrate')){
      const cel=document.createElement('div');
      cel.className='celebrate';
      cel.innerHTML='<div>🎉</div><p>Alles eingekauft!</p>';
      tab.insertBefore(cel,tab.querySelector('.catcard'));
    }
  }
}

function resetList(prefix){
  if(!confirm('Alle Häkchen entfernen?')) return;
  const data=prefix==='c'?CAIRNS:BAMAGA;
  data.flatMap(c=>c.items).forEach(it=>{
    setChecked(it.id,false);
    const cb=document.getElementById('cb-'+it.id);
    const nm=document.getElementById('nm-'+it.id);
    const qt=document.getElementById('qt-'+it.id);
    if(cb) cb.className='chk-cb';
    if(nm) nm.className='chk-name';
    if(qt) qt.className='chk-qty';
  });
  updateProgress(prefix);
  const tabId=prefix==='c'?'cairns':'bamaga';
  const cel=document.getElementById('tab-'+tabId).querySelector('.celebrate');
  if(cel) cel.remove();
}

function checkAll(prefix){
  const data=prefix==='c'?CAIRNS:BAMAGA;
  data.flatMap(c=>c.items).forEach(it=>{
    setChecked(it.id,true);
    const cb=document.getElementById('cb-'+it.id);
    const nm=document.getElementById('nm-'+it.id);
    const qt=document.getElementById('qt-'+it.id);
    if(cb) cb.className='chk-cb checked';
    if(nm) nm.className='chk-name done';
    if(qt) qt.className='chk-qty done';
  });
  updateProgress(prefix);
}

// ─────────────────────────────────────────────
//  NAV & SCROLL
// ─────────────────────────────────────────────

function showTab(id){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('active'));
  var tabEl=document.getElementById('tab-'+id);
  if(tabEl) tabEl.classList.add('active');
  var activeBtn=document.querySelector('[data-tab="'+id+'"]');
  if(activeBtn) activeBtn.classList.add('active');
  document.getElementById('content').scrollTop=0;
}

document.getElementById('main-nav').addEventListener('click',function(e){
  var btn=e.target.closest('[data-tab]');
  if(btn) showTab(btn.getAttribute('data-tab'));
});

var content=document.getElementById('content');
var scrollBtn=document.getElementById('scrollTop');
content.addEventListener('scroll',function(){
  scrollBtn.classList.toggle('show',content.scrollTop>300);
});
